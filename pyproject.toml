[project]
name = "her-with-jax"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "equinox>=0.13.0",
    "ipywidgets>=8.1.7",
    "jaxtyping>=0.3.2",
    "matplotlib",  # Any version should work, really
    "optax>=0.2.5",
    "tqdm>=4.67.1",
    "treescope>=0.1.10",
]

[dependency-groups]
cuda = [
    "jax[cuda]>=0.7.0",
]
dev = [
    "jupyterlab>=4.4.5",
]
